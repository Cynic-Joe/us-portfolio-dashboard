<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Jake 美股组合 Dashboard</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #080a0f;
      --panel: #10141d;
      --panel-2: #151b27;
      --line: #242c3a;
      --text: #edf2ff;
      --muted: #8b95a7;
      --accent: #6ee7b7;
      --accent-2: #60a5fa;
      --warn: #fbbf24;
      --bad: #fb7185;
      --good: #34d399;
      --shadow: 0 18px 60px rgba(0,0,0,.35);
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", sans-serif;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: radial-gradient(circle at top left, #172033 0, transparent 34rem), var(--bg); color: var(--text); }
    button, input, select, textarea { font: inherit; }
    .wrap { width: min(1440px, calc(100vw - 32px)); margin: 24px auto 48px; }
    header { display: flex; justify-content: space-between; gap: 20px; align-items: flex-start; margin-bottom: 18px; }
    h1 { margin: 0; font-size: clamp(28px, 4vw, 46px); letter-spacing: -0.04em; }
    .subtitle { margin-top: 8px; color: var(--muted); max-width: 780px; line-height: 1.55; }
    .actions { display: flex; flex-wrap: wrap; gap: 8px; justify-content: flex-end; }
    .btn { border: 1px solid var(--line); color: var(--text); background: #121826; border-radius: 12px; padding: 10px 12px; cursor: pointer; transition: .16s ease; }
    .btn:hover { border-color: #3b82f6; transform: translateY(-1px); }
    .btn.primary { background: linear-gradient(135deg, #2563eb, #059669); border-color: transparent; }
    .grid { display: grid; grid-template-columns: repeat(12, 1fr); gap: 14px; }
    .card { background: linear-gradient(180deg, rgba(255,255,255,.035), rgba(255,255,255,.015)), var(--panel); border: 1px solid var(--line); border-radius: 22px; box-shadow: var(--shadow); overflow: hidden; }
    .card.pad { padding: 18px; }
    .span-3 { grid-column: span 3; } .span-4 { grid-column: span 4; } .span-5 { grid-column: span 5; } .span-7 { grid-column: span 7; } .span-8 { grid-column: span 8; } .span-12 { grid-column: span 12; }
    .metric-label { color: var(--muted); font-size: 13px; }
    .metric { font-size: 30px; letter-spacing: -0.03em; margin-top: 8px; font-weight: 760; }
    .metric small { font-size: 14px; color: var(--muted); font-weight: 500; }
    .pill { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); border-radius: 999px; padding: 5px 9px; color: var(--muted); background: rgba(255,255,255,.03); font-size: 12px; }
    .good { color: var(--good); } .bad { color: var(--bad); } .warn { color: var(--warn); } .muted { color: var(--muted); }
    table { width: 100%; border-collapse: collapse; }
    th, td { padding: 10px 9px; border-bottom: 1px solid rgba(255,255,255,.07); text-align: right; vertical-align: middle; }
    th { color: var(--muted); font-size: 12px; font-weight: 650; background: rgba(255,255,255,.025); position: sticky; top: 0; z-index: 1; }
    td:first-child, th:first-child, td:nth-child(2), th:nth-child(2) { text-align: left; }
    tr:last-child td { border-bottom: 0; }
    input, select, textarea { width: 100%; color: var(--text); background: #0c111b; border: 1px solid #263042; border-radius: 10px; padding: 8px; outline: none; }
    input:focus, select:focus, textarea:focus { border-color: var(--accent-2); box-shadow: 0 0 0 3px rgba(96,165,250,.12); }
    input[type="number"] { text-align: right; }
    .table-wrap { overflow: auto; max-height: 560px; }
    .ticker { font-weight: 780; letter-spacing: .02em; }
    .name { color: var(--muted); font-size: 12px; margin-top: 2px; }
    .bar { height: 10px; background: #0b1020; border: 1px solid #202a3d; border-radius: 999px; overflow: hidden; }
    .bar > i { display: block; height: 100%; width: var(--w); background: linear-gradient(90deg, var(--accent-2), var(--accent)); border-radius: inherit; }
    .group-row { display: grid; grid-template-columns: 110px 1fr 76px 88px 92px; gap: 10px; align-items: center; padding: 11px 0; border-bottom: 1px solid rgba(255,255,255,.07); }
    .group-row:last-child { border-bottom: 0; }
    .section-head { display: flex; justify-content: space-between; gap: 12px; align-items: center; margin-bottom: 12px; }
    .section-head h2 { margin: 0; font-size: 18px; letter-spacing: -0.02em; }
    .note { color: var(--muted); font-size: 13px; line-height: 1.55; }
    .rules { display: grid; gap: 10px; }
    .rule { padding: 12px; border: 1px solid var(--line); background: rgba(255,255,255,.025); border-radius: 16px; }
    .rule b { color: var(--text); }
    .split { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .textarea { min-height: 110px; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px; }
    @media (max-width: 980px) { .span-3,.span-4,.span-5,.span-7,.span-8 { grid-column: span 12; } header { flex-direction: column; } .actions { justify-content: flex-start; } .group-row { grid-template-columns: 92px 1fr 58px 72px 78px; } }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <div>
        <h1>美股组合 Dashboard</h1>
        <div class="subtitle">用于维护当前持仓、目标仓位、实时价格和补仓缺口。默认数据来自 2026-06 的订单截图；股价需要手动更新或粘贴最新价格。</div>
      </div>
      <div class="actions">
        <button class="btn primary" id="refreshQuotes">Finnhub 更新股价</button>
        <button class="btn" id="addRow">新增标的</button>
        <button class="btn" id="exportBtn">导出 JSON</button>
        <button class="btn" id="importBtn">导入 JSON</button>
        <button class="btn" id="resetBtn">重置默认</button>
        <button class="btn primary" id="saveBtn">保存</button>
      </div>
    </header>

    <section class="grid" id="metrics"></section>

    <section class="grid" style="margin-top:14px">
      <div class="card pad span-7">
        <div class="section-head"><h2>目标配比</h2><span class="pill">可直接改百分比</span></div>
        <div id="groups"></div>
      </div>
      <div class="card pad span-5">
        <div class="section-head"><h2>六月风控框架</h2><span class="pill">手动更新</span></div>
        <div class="split">
          <label class="note">VIX<input id="vix" type="number" step="0.01"></label>
          <label class="note">10Y 美债 %<input id="yield10y" type="number" step="0.01"></label>
        </div>
        <div style="height:10px"></div>
        <div class="split">
          <label class="note">自动刷新分钟<input id="refreshMinutes" type="number" min="0" step="1"></label>
          <label class="note">更新状态<input id="quoteStatus" readonly></label>
        </div>
        <div style="height:10px"></div>
        <div class="rules" id="riskRules"></div>
      </div>
    </section>

    <section class="card span-12" style="margin-top:14px">
      <div class="section-head" style="padding:18px 18px 0"><h2>持仓与补仓缺口</h2><span class="pill">$1/笔平台费已纳入提示</span></div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th style="min-width:130px">标的</th>
              <th style="min-width:150px">分组</th>
              <th>股数</th>
              <th>成本价</th>
              <th>现价</th>
              <th>市值</th>
              <th>盈亏</th>
              <th>目标缺口</th>
              <th>建议股数</th>
              <th>拆单手续费阈值</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="holdings"></tbody>
        </table>
      </div>
    </section>

    <section class="grid" style="margin-top:14px">
      <div class="card pad span-5">
        <div class="section-head"><h2>现金与参数</h2><span class="pill">影响总资产</span></div>
        <div class="split">
          <label class="note">现金 USD<input id="cash" type="number" step="0.01"></label>
          <label class="note">每笔平台费 USD<input id="fee" type="number" step="0.01"></label>
        </div>
        <div style="height:10px"></div>
        <label class="note">备注<textarea id="notes" class="textarea"></textarea></label>
      </div>
      <div class="card pad span-7">
        <div class="section-head"><h2>执行提醒</h2><span class="pill">按当前输入自动生成</span></div>
        <div id="suggestions" class="rules"></div>
      </div>
    </section>
  </div>

  <script>
    const defaultState = {
      cash: 569.19,
      fee: 1,
      refreshMinutes: 0,
      quoteStatus: '未更新',
      vix: 21.51,
      yield10y: 4.47,
      notes: '目标：60% SPMO / 8% NOW+SPCE或短期热门 / 14% MU+DRAM / 5% NOK / 5% XMHQ / 8%现金。\n分批补仓时，后一笔只有在价格优势能覆盖额外 $1 平台费时才有经济意义。',
      groups: [
        { id:'spmo', label:'SPMO', target:60 },
        { id:'hot', label:'NOW/SPCE/热门', target:8 },
        { id:'storage', label:'MU+DRAM', target:14 },
        { id:'nok', label:'NOKIA', target:5 },
        { id:'xmhq', label:'XMHQ', target:5 },
        { id:'cash', label:'现金防御', target:8 }
      ],
      holdings: [
        { ticker:'SPMO', name:'Invesco S&P 500 Momentum ETF', group:'spmo', qty:3.639, cost:154, price:144.28, deferShares:1, lastDecision:144.28 },
        { ticker:'DRAM', name:'Roundhill Memory ETF', group:'storage', qty:1, cost:66.15, price:55.79, deferShares:1, lastDecision:55.79 },
        { ticker:'MU', name:'Micron Technology', group:'storage', qty:0.0694, cost:1044.55, price:864.01, deferShares:0, lastDecision:864.01 },
        { ticker:'NOW', name:'ServiceNow', group:'hot', qty:0.52, cost:132, price:132, deferShares:0, lastDecision:132 },
        { ticker:'SPCE', name:'Virgin Galactic / hot bucket', group:'hot', qty:0, cost:0, price:0, manualValue:28.84, deferShares:0, lastDecision:0 },
        { ticker:'NOK', name:'Nokia', group:'nok', qty:2, cost:14.38, price:14.38, deferShares:2, lastDecision:14.38 },
        { ticker:'XMHQ', name:'Invesco S&P MidCap Quality ETF', group:'xmhq', qty:0, cost:0, price:0, deferShares:0, lastDecision:0 }
      ]
    };

    let state = load();
    let refreshTimer = null;
    const $ = id => document.getElementById(id);
    const fmt = n => Number.isFinite(n) ? n.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2}) : '—';
    const pct = n => Number.isFinite(n) ? `${n.toFixed(1)}%` : '—';
    const valueOf = h => h.manualValue ? Number(h.manualValue) : Number(h.qty||0) * Number(h.price||0);
    const costValueOf = h => Number(h.qty||0) * Number(h.cost||0);

    function load(){
      try { return JSON.parse(localStorage.getItem('jakePortfolioDashboard')) || structuredClone(defaultState); }
      catch { return structuredClone(defaultState); }
    }
    function save(){ localStorage.setItem('jakePortfolioDashboard', JSON.stringify(state)); }
    function groupLabel(id){ return state.groups.find(g=>g.id===id)?.label || id; }
    function totalValue(){ return state.holdings.reduce((s,h)=>s+valueOf(h),0) + Number(state.cash||0); }
    function groupValue(id){ return id==='cash' ? Number(state.cash||0) : state.holdings.filter(h=>h.group===id).reduce((s,h)=>s+valueOf(h),0); }

    function bindTopInputs(){
      $('cash').value = state.cash; $('fee').value = state.fee; $('vix').value = state.vix; $('yield10y').value = state.yield10y; $('notes').value = state.notes || '';
      $('refreshMinutes').value = state.refreshMinutes || 0; $('quoteStatus').value = state.quoteStatus || '未更新';
      ['cash','fee','vix','yield10y','refreshMinutes','notes'].forEach(id => $(id).oninput = e => {
        state[id === 'yield10y' ? 'yield10y' : id] = id==='notes' ? e.target.value : Number(e.target.value);
        if (id === 'refreshMinutes') setupAutoRefresh();
        render();
      });
    }

    function setupAutoRefresh(){
      if (refreshTimer) clearInterval(refreshTimer);
      const mins = Number(state.refreshMinutes || 0);
      if (mins > 0) refreshTimer = setInterval(refreshQuotes, mins * 60 * 1000);
    }

    async function refreshQuotes(){
      const alwaysTrack = new Set(['SPMO','DRAM','NOK','MU','NOW','XMHQ']);
      const symbols = [...new Set(state.holdings
        .map(h => String(h.ticker||'').trim().toUpperCase())
        .filter(t => t && !['CASH','SPCE'].includes(t))
        .filter(t => alwaysTrack.has(t) || Number(hByTicker(t)?.qty || 0) !== 0)
      )];
      if (!symbols.length) return;
      state.quoteStatus = '更新中…'; render();
      try {
        const data = await fetchQuotes(symbols);
        const quotes = data.quotes || {};
        let updated = 0;
        for (const h of state.holdings) {
          const q = quotes[String(h.ticker||'').toUpperCase()];
          if (q && Number(q.c) > 0) { h.price = Number(q.c); updated++; }
        }
        const errCount = Object.keys(data.errors || {}).length;
        const source = data.source ? ` · ${data.source}` : '';
        state.quoteStatus = `${new Date().toLocaleTimeString()} 更新 ${updated} 个${errCount ? `，失败 ${errCount}` : ''}${source}`;
      } catch (e) {
        state.quoteStatus = '更新失败：云端 quotes 不存在，或本地 server 未启动';
      }
      render();
    }

    async function fetchQuotes(symbols){
      const isLocal = location.hostname === '127.0.0.1' || location.hostname === 'localhost';
      if (isLocal) {
        try {
          const local = await fetch('/api/quotes?symbols=' + encodeURIComponent(symbols.join(',')));
          if (local.ok) return await local.json();
        } catch {}
      }
      const res = await fetch('quotes/latest.json?ts=' + Date.now());
      if (!res.ok) throw new Error('quotes/latest.json not found');
      const data = await res.json();
      return { quotes: data.quotes || {}, errors: data.errors || {}, source: `cloud ${data.updated_at || ''}` };
    }

    function hByTicker(ticker){ return state.holdings.find(h => String(h.ticker||'').toUpperCase() === ticker); }

    function renderMetrics(){
      const total = totalValue();
      const invested = total - Number(state.cash||0);
      const cashPct = total ? Number(state.cash||0)/total*100 : 0;
      const pnl = state.holdings.reduce((s,h)=>s + (valueOf(h)-costValueOf(h)),0);
      const targetSum = state.groups.reduce((s,g)=>s+Number(g.target||0),0);
      $('metrics').innerHTML = [
        ['总资产', `$${fmt(total)}`, `目标合计 ${targetSum.toFixed(1)}%`],
        ['持仓市值', `$${fmt(invested)}`, `${pct(total?invested/total*100:0)} invested`],
        ['现金', `$${fmt(state.cash)}`, `${pct(cashPct)} cash`],
        ['未实现盈亏', `${pnl>=0?'+':''}$${fmt(pnl)}`, pnl>=0?'green':'red']
      ].map(m => `<div class="card pad span-3"><div class="metric-label">${m[0]}</div><div class="metric ${m[2]==='red'?'bad':m[2]==='green'?'good':''}">${m[1]}</div><div class="note">${m[2]}</div></div>`).join('');
    }

    function renderGroups(){
      const total = totalValue();
      $('groups').innerHTML = state.groups.map((g,i)=>{
        const val = groupValue(g.id), actual = total?val/total*100:0, gap = total*(Number(g.target||0)/100)-val;
        return `<div class="group-row">
          <b>${g.label}</b>
          <div class="bar" title="当前 ${pct(actual)} / 目标 ${g.target}%"><i style="--w:${Math.min(100, Math.max(0, actual/(Number(g.target||1))*100))}%"></i></div>
          <input type="number" step="0.1" value="${g.target}" data-group-target="${i}">
          <span>${pct(actual)}</span>
          <span class="${gap>=0?'good':'bad'}">${gap>=0?'+':''}$${fmt(gap)}</span>
        </div>`;
      }).join('');
      document.querySelectorAll('[data-group-target]').forEach(el => el.oninput = e => { state.groups[Number(e.target.dataset.groupTarget)].target = Number(e.target.value); render(); });
    }

    function renderHoldings(){
      const total = totalValue();
      $('holdings').innerHTML = state.holdings.map((h,i)=>{
        const val = valueOf(h), costVal = costValueOf(h), pnl = val - costVal;
        const group = state.groups.find(g=>g.id===h.group);
        const gVal = groupValue(h.group), gap = group ? total*(group.target/100)-gVal : 0;
        const suggestedShares = h.price > 0 && gap > 0 ? gap / h.price : 0;
        const threshold = Number(h.deferShares||0) > 0 ? Number(state.fee||0)/Number(h.deferShares) : 0;
        const usefulBelow = Number(h.lastDecision||0) > 0 && threshold ? Number(h.lastDecision)-threshold : null;
        return `<tr>
          <td><div class="ticker"><input value="${h.ticker}" data-field="ticker" data-i="${i}"></div><div class="name"><input value="${h.name||''}" data-field="name" data-i="${i}"></div></td>
          <td><select data-field="group" data-i="${i}">${state.groups.map(g=>`<option value="${g.id}" ${g.id===h.group?'selected':''}>${g.label}</option>`).join('')}</select></td>
          <td><input type="number" step="0.0001" value="${h.qty||0}" data-field="qty" data-i="${i}"></td>
          <td><input type="number" step="0.01" value="${h.cost||0}" data-field="cost" data-i="${i}"></td>
          <td><input type="number" step="0.01" value="${h.price||0}" data-field="price" data-i="${i}"></td>
          <td>$${fmt(val)}</td>
          <td class="${pnl>=0?'good':'bad'}">${pnl>=0?'+':''}$${fmt(pnl)}</td>
          <td class="${gap>=0?'good':'bad'}">${gap>=0?'+':''}$${fmt(gap)}</td>
          <td>${suggestedShares>0 ? suggestedShares.toFixed(3) : '—'}</td>
          <td><div class="note">待补股数 <input type="number" step="0.01" value="${h.deferShares||0}" data-field="deferShares" data-i="${i}">参考价 <input type="number" step="0.01" value="${h.lastDecision||0}" data-field="lastDecision" data-i="${i}">${usefulBelow ? `≤ $${fmt(usefulBelow)}` : '—'}</div></td>
          <td><button class="btn" data-del="${i}">删</button></td>
        </tr>`;
      }).join('');
      document.querySelectorAll('[data-field]').forEach(el => el.oninput = e => {
        const i = Number(e.target.dataset.i), f = e.target.dataset.field;
        state.holdings[i][f] = ['ticker','name','group'].includes(f) ? e.target.value : Number(e.target.value);
        render();
      });
      document.querySelectorAll('[data-del]').forEach(el => el.onclick = e => { state.holdings.splice(Number(e.target.dataset.del),1); render(); });
    }

    function renderRisk(){
      const vix = Number(state.vix||0), y = Number(state.yield10y||0);
      const vixText = vix < 20 ? ['good','VIX < 20：系统性风险缓和'] : vix > 23 ? ['bad','VIX > 23：踩踏风险仍高，反弹偏减仓'] : ['warn','VIX 20–23：风险未解除，等待确认'];
      const yText = y < 4.5 ? ['good','10Y < 4.5%：利率压力暂缓'] : ['bad','10Y ≥ 4.5%：科技/半导体估值继续承压'];
      $('riskRules').innerHTML = [vixText,yText,['warn','CPI/FOMC/OpEx 前不打光现金；反弹不是自动追涨信号。']].map(r=>`<div class="rule"><b class="${r[0]}">${r[1]}</b></div>`).join('');
    }

    function renderSuggestions(){
      const total = totalValue();
      const lines = [];
      for (const g of state.groups) {
        const val = groupValue(g.id), gap = total*(g.target/100)-val;
        if (gap > 5 && g.id !== 'cash') lines.push(`<div class="rule"><b>${g.label}</b> 低于目标约 <span class="good">$${fmt(gap)}</span>。优先等计划价，不因前面买贵而追涨。</div>`);
        if (gap < -5 && g.id !== 'cash') lines.push(`<div class="rule"><b>${g.label}</b> 高于目标约 <span class="bad">$${fmt(-gap)}</span>。反弹时可考虑冻结/减风险。</div>`);
      }
      const fee = Number(state.fee||0);
      const feeLines = state.holdings.filter(h=>Number(h.deferShares)>0 && Number(h.lastDecision)>0).map(h=>{
        const need = fee/Number(h.deferShares);
        const below = Number(h.lastDecision)-need;
        return `<div class="rule"><b>${h.ticker}</b> 分批补仓检查：剩余 ${h.deferShares} 股，第二笔至少比参考价低 <span class="warn">$${fmt(need)}/股</span>，即 ≤ <span class="warn">$${fmt(below)}</span> 才覆盖额外平台费。</div>`;
      });
      $('suggestions').innerHTML = [...lines.slice(0,5), ...feeLines].join('') || '<div class="rule"><b>当前无明显动作</b><div class="note">更新价格或目标后会自动生成提示。</div></div>';
    }

    function render(){
      renderMetrics(); bindTopInputs(); renderGroups(); renderHoldings(); renderRisk(); renderSuggestions(); save();
    }

    $('saveBtn').onclick = () => { save(); alert('已保存到本机浏览器 localStorage'); };
    $('refreshQuotes').onclick = refreshQuotes;
    $('resetBtn').onclick = () => { if(confirm('确定重置为默认数据？')) { state = structuredClone(defaultState); render(); } };
    $('addRow').onclick = () => { state.holdings.push({ticker:'NEW', name:'', group:'hot', qty:0, cost:0, price:0, deferShares:0, lastDecision:0}); render(); };
    $('exportBtn').onclick = async () => { await navigator.clipboard.writeText(JSON.stringify(state,null,2)); alert('JSON 已复制到剪贴板'); };
    $('importBtn').onclick = () => {
      const raw = prompt('粘贴导出的 JSON');
      if (!raw) return;
      try { state = JSON.parse(raw); render(); } catch(e) { alert('JSON 格式错误'); }
    };
    render();
    setupAutoRefresh();
  </script>
</body>
</html>
